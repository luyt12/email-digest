name: Email Digest

on:
  schedule:
    - cron: '40 20 * * *'
    - cron: '40 0 * * *'
    - cron: '40 5 * * *'
    - cron: '40 8 * * *'
    - cron: '40 11 * * *'
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      schedule_index:
        description: '时间窗口索引 (0-5)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch, translate and generate EPUB
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          SCHEDULE_INDEX: ${{ github.event.inputs.schedule_index }}
        run: python -m src.main


      - name: Commit EPUB files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epubs/ data/processed_emails.json
          git diff --cached --quiet || git commit -m "add epub: $(date +%Y-%m-%d_%H%M)"
          git push
      - name: Upload processed IDs (backup)
        uses: actions/upload-artifact@v4
        with:
          name: processed-emails
          path: data/processed_emails.json
          retention-days: 7

      - name: Upload EPUB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epub-files
          path: epubs/
          retention-days: 30