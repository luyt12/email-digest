name: Email Digest

on:
  schedule:
    - cron: '40 20 * * *'
    - cron: '40 0 * * *'
    - cron: '40 5 * * *'
    - cron: '40 8 * * *'
    - cron: '40 11 * * *'
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      schedule_index:
        description: '鏃堕棿绐楀彛绱㈠紩 (0-5)'
        required: false
        default: ''
        type: string

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore processed emails cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: data/processed_emails.json
          key: processed-emails-${{ github.run_number }}
          restore-keys: |
            processed-emails-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch, translate and send emails
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          SCHEDULE_INDEX: ${{ github.event.inputs.schedule_index }}
        run: python -m src.main

      - name: Save processed emails cache
        uses: actions/cache/save@v4
        with:
          path: data/processed_emails.json
          key: processed-emails-${{ github.run_number }}

      - name: Upload processed IDs (backup)
        uses: actions/upload-artifact@v4
        with:
          name: processed-emails
          path: data/processed_emails.json
          retention-days: 7
