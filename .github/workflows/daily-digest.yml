name: Email Digest

on:
  schedule:
    # 每天 6 次：04:40, 08:40, 13:40, 16:40, 19:40, 23:40 北京时间
    # 北京时间 04:40 = UTC 20:40 (前一天)
    - cron: '40 20 * * *'
    # 北京时间 08:40 = UTC 00:40
    - cron: '40 0 * * *'
    # 北京时间 13:40 = UTC 05:40
    - cron: '40 5 * * *'
    # 北京时间 16:40 = UTC 08:40
    - cron: '40 8 * * *'
    # 北京时间 19:40 = UTC 11:40
    - cron: '40 11 * * *'
    # 北京时间 23:40 = UTC 15:40
    - cron: '40 15 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Fetch, translate and send emails
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        run: python -m src.main
        
      - name: Upload processed IDs
        uses: actions/upload-artifact@v4
        with:
          name: processed-emails
          path: data/processed_emails.json
          retention-days: 7
