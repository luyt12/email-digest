name: Test OpenRouter Free Model

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Test translation with openrouter/free
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 -c "
import os
import requests
import json

api_key = os.environ.get('OPENROUTER_API_KEY')
if not api_key:
    print('ERROR: OPENROUTER_API_KEY not set')
    exit(1)

# Test article
test_text = '''China's influence in Zambia has grown significantly over the past decade, 
with investments in mining, infrastructure, and telecommunications raising both opportunities 
and concerns among local communities.'''

print('Testing openrouter/free model...')
print('API Key (first 10 chars):', api_key[:10] + '...')

response = requests.post(
    'https://openrouter.ai/api/v1/chat/completions',
    headers={
        'Authorization': f'Bearer {api_key}',
        'Content-Type': 'application/json',
        'HTTP-Referer': 'https://github.com/luyt12/email-digest',
        'X-Title': 'Email Digest Test'
    },
    json={
        'model': 'openrouter/free',
        'messages': [
            {'role': 'system', 'content': 'You are a professional translator. Translate the following English text to Chinese. Only output the translation, no explanations.'},
            {'role': 'user', 'content': test_text}
        ],
        'temperature': 0.3
    },
    timeout=120
)

print('Status:', response.status_code)
if response.status_code == 200:
    result = response.json()
    translation = result['choices'][0]['message']['content']
    print('Translation:', translation)
    print('Model used:', result.get('model', 'unknown'))
else:
    print('Error:', response.text)
    exit(1)
"
